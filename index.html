<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Train Reservation System | Professional Simulation</title>
    <style>
        :root { --admin-color: #2c3e50; --staff-color: #27ae60; --error: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 95%; max-width: 1100px; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; display: none; min-height: 650px; }
        
        /* Login Styling */
        #login-screen { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .login-field { margin-bottom: 15px; text-align: left; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--admin-color); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        
        /* Layout */
        .sidebar { width: 260px; background: var(--admin-color); color: white; padding: 25px; flex-shrink: 0; }
        .main-content { flex-grow: 1; padding: 40px; position: relative; overflow-y: auto; }
        .nav-item { padding: 12px 15px; margin: 8px 0; border-radius: 6px; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.05); }
        .nav-item:hover { background: rgba(255,255,255,0.15); }
        .logout-btn { background: #e74c3c; width: auto; padding: 8px 15px; position: absolute; top: 20px; right: 20px; }

        /* UI Elements */
        .uc-section { display: none; }
        .active { display: block; }
        .data-card { background: #f8f9fa; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f1f1f1; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="margin-bottom: 5px;">Train System</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Enter credentials to access portal</p>
    
    <div class="login-field">
        <label>Role</label>
        <select id="login-role">
            <option value="admin">System Administrator</option>
            <option value="staff">Staff Member</option>
        </select>
    </div>
    <div class="login-field">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g., admin01">
    </div>
    <div class="login-field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button onclick="handleLogin()" style="margin-top: 10px;">Login</button>
    <p id="login-error" style="color: var(--error); font-size: 12px; margin-top: 10px; display: none;">Invalid Username or Password</p>
    
    <div style="margin-top: 20px; font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 10px;">
        Demo - Admin: <b>admin / admin123</b><br>
        Demo - Staff: <b>staff / staff123</b>
    </div>
</div>

<div id="app" class="app-container">
    <div id="sidebar" class="sidebar">
        <h3 id="display-role">Portal</h3>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <div id="menu-container"></div>
    </div>

    <div class="main-content">
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <div id="sec-trains" class="uc-section">
            <h3>[UC: Manage Trains]</h3>
            <div class="data-card">
                <input type="text" id="t_id" placeholder="Train ID">
                <input type="text" id="t_type" placeholder="Train Type">
                <button onclick="addTrain()">Add Train</button>
            </div>
            <table><thead><tr><th>Train ID</th><th>Type</th></tr></thead><tbody id="trainBody"></tbody></table>
        </div>

        <div id="sec-schedules" class="uc-section">
            <h3>[UC: Create Schedule]</h3>
            <div class="data-card">
                <select id="s_train"></select>
                <input type="text" id="s_route" placeholder="Route (Source - Dest)">
                <input type="datetime-local" id="s_time">
                <input type="number" id="s_seats" placeholder="Capacity">
                <button onclick="addSchedule()">Create Trip</button>
            </div>
            <table><thead><tr><th>Trip</th><th>Time</th><th>Seats</th></tr></thead><tbody id="scheduleBody"></tbody></table>
        </div>

        <div id="sec-ticketing" class="uc-section">
            <h3>[UC: Issue Ticket]</h3>
            <div class="data-card">
                <input type="text" id="p_name" placeholder="Passenger Name">
                <select id="tick_s"></select>
                <button onclick="buyTicket()" style="background:var(--staff-color)">Issue & Print Ticket</button>
            </div>
            <h4>Active Tickets</h4>
            <div id="ticketList"></div>
        </div>

        <div id="sec-reports" class="uc-section">
            <h3>[UC: Generate Reports]</h3>
            <div class="data-card" id="reportArea"></div>
            <button onclick="generateStats()" style="background:#34495e">Refresh Report</button>
        </div>
    </div>
</div>

<script>
    // 1. DATA INITIALIZATION (Simulation of Database with Dummy Data)
    const DUMMY_DATA = {
        trains: [{id: 'EX-501', type: 'Bullet'}, {id: 'L-20', type: 'Local'}],
        schedules: [
            {id: 1, train: 'EX-501', route: 'Riyadh - Dammam', time: '2026-05-01T10:00', seats: 45},
            {id: 2, train: 'L-20', route: 'Jeddah - Makkah', time: '2026-05-01T14:30', seats: 12}
        ],
        passengers: [],
        tickets: []
    };

    let db = JSON.parse(localStorage.getItem('train_db')) || DUMMY_DATA;

    // 2. AUTHENTICATION (UC: Login)
    function handleLogin() {
        const role = document.getElementById('login-role').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Simple validation logic
        if ((role === 'admin' && user === 'admin' && pass === 'admin123') || 
            (role === 'staff' && user === 'staff' && pass === 'staff123')) {
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            setupUI(role);
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function logout() {
        location.reload(); // Hard reset for security
    }

    // 3. UI SETUP
    function setupUI(role) {
        const menu = document.getElementById('menu-container');
        const sidebar = document.getElementById('sidebar');
        menu.innerHTML = '';

        if(role === 'admin') {
            document.getElementById('display-role').innerText = "Administrator";
            sidebar.style.background = '#2c3e50';
            menu.innerHTML += `<div class="nav-item" onclick="show('sec-trains')">Manage Fleet</div>`;
            menu.innerHTML += `<div class="nav-item" onclick="show('sec-schedules')">Route Schedules</div>`;
            show('sec-trains');
        } else {
            document.getElementById('display-role').innerText = "Staff Member";
            sidebar.style.background = '#27ae60';
            menu.innerHTML += `<div class="nav-item" onclick="show('sec-ticketing')">Ticket Sales</div>`;
            menu.innerHTML += `<div class="nav-item" onclick="show('sec-reports')">System Reports</div>`;
            show('sec-ticketing');
        }
        refreshData();
    }

    function show(id) {
        document.querySelectorAll('.uc-section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 4. CORE LOGIC (Use Cases)
    function addTrain() {
        const id = document.getElementById('t_id').value;
        const type = document.getElementById('t_type').value;
        if(id && type) {
            db.trains.push({id, type});
            saveAndRefresh();
        }
    }

    function addSchedule() {
        const s = {
            id: Date.now(),
            train: document.getElementById('s_train').value,
            route: document.getElementById('s_route').value,
            time: document.getElementById('s_time').value,
            seats: parseInt(document.getElementById('s_seats').value)
        };
        db.schedules.push(s);
        saveAndRefresh();
    }

    function buyTicket() {
        const sid = document.getElementById('tick_s').value;
        const name = document.getElementById('p_name').value;
        const sch = db.schedules.find(x => x.id == sid);

        if(sch && sch.seats > 0 && name) {
            sch.seats--;
            db.tickets.push({passenger: name, route: sch.route, time: sch.time});
            saveAndRefresh();
            alert("Ticket issued successfully!");
        } else {
            alert("Check availability or name field!");
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('train_db', JSON.stringify(db));
        refreshData();
    }

    function refreshData() {
        // Update Tables
        document.getElementById('trainBody').innerHTML = db.trains.map(t => `<tr><td>${t.id}</td><td>${t.type}</td></tr>`).join('');
        document.getElementById('scheduleBody').innerHTML = db.schedules.map(s => `<tr><td>${s.route}</td><td>${s.time}</td><td>${s.seats}</td></tr>`).join('');
        
        // Update Selectors
        document.getElementById('s_train').innerHTML = db.trains.map(t => `<option>${t.id}</option>`).join('');
        document.getElementById('tick_s').innerHTML = db.schedules.map(s => `<option value="${s.id}">${s.route} (${s.seats} left)</option>`).join('');
        
        // Update Ticket View
        document.getElementById('ticketList').innerHTML = db.tickets.map(t => `<div class="data-card">🎟️ <b>${t.passenger}</b> - ${t.route}</div>`).join('');
        generateStats();
    }

    function generateStats() {
        document.getElementById('reportArea').innerHTML = `
            <p>Total Registered Trains: <b>${db.trains.length}</b></p>
            <p>Active Daily Trips: <b>${db.schedules.length}</b></p>
            <p>Tickets Sold Today: <b>${db.tickets.length}</b></p>
        `;
    }
</script>
</body>
</html>
